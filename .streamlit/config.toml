# base = "light" pinned: app.py's custom CSS hard-codes light surfaces/text colours.
[theme]
# Light theme A: Ice Blue / Graphite / Flame Orange (print palette of the tolling-fee dashboard)
base                     = "light"
primaryColor             = "#F26B1D"
backgroundColor          = "#EEF4F8"
secondaryBackgroundColor = "#F4F8FB"
textColor                = "#22272D"
borderColor              = "#C9D3DC"
dataframeHeaderBackgroundColor = "#F4F8FB"
showWidgetBorder         = false
baseRadius               = "0.625rem"
# 14px root size: every rem-based size (theme and app.py CSS) shrinks together for denser forms
baseFontSize             = 14
metricValueFontSize      = "1.6rem"
# 한글 가독성: Pretendard (CDN). 로드 실패 시 브라우저 기본 sans-serif로 대체된다.
font        = "'Pretendard Variable':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
headingFont = "'Pretendard Variable':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
# 차트 기본 색: 본계열 스틸 / 양수 틸 / 강조 주황 / 대기 황토 / 음수 레드
chartCategoricalColors   = ["#9AA8B6", "#2A9D8F", "#F26B1D", "#D4A72C", "#E0524A", "#6F8FB8", "#B08D5E", "#8D98A4"]

# Basic palette (metric deltas, alerts, badges)
redColor                 = "#E0524A"
redTextColor             = "#B42318"
redBackgroundColor       = "rgba(224,82,74,0.12)"
greenColor               = "#2A9D8F"
greenTextColor           = "#0F766E"
greenBackgroundColor     = "rgba(42,157,143,0.13)"
orangeColor              = "#F26B1D"
orangeTextColor          = "#B84A0C"
orangeBackgroundColor    = "rgba(242,107,29,0.12)"
yellowColor              = "#D4A72C"
yellowTextColor          = "#A16207"
yellowBackgroundColor    = "rgba(212,167,44,0.15)"
blueColor                = "#6F8FB8"
blueTextColor            = "#3B5B85"
blueBackgroundColor      = "rgba(111,143,184,0.15)"
grayColor                = "#8C98A5"
grayTextColor            = "#5E6670"
grayBackgroundColor      = "rgba(94,102,112,0.10)"

[client]
# Hide the Deploy/developer toolbar entries for a cleaner header
toolbarMode = "minimal"
